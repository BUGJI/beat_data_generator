name: Release

# 打 tag（如 v0.3.5）即自动校验、打包 Windows / Linux 并发布到 GitHub Release。
# workflow_dispatch 仅做打包演练（不发布），产物可在 Actions 的 Artifacts 下载。
on:
  push:
    # dev 分支只做打包演练（不发布），tag 才正式发布
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # 校验不需要 Electron 运行时，跳过二进制下载以加快速度
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  package:
    name: package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tag 推送时发布到 Release，手动触发时只打包
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish ${{ env.PUBLISH }}

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: ignore

  publish-release:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # electron-builder 默认把 Release 建为草稿（draft），打包全部完成后转正，
      # 这样自动更新（latest.yml / latest-linux.yml）才对外可见。
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
