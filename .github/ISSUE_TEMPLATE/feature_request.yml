name: 功能建议
description: 提一个需求或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提需求时，**使用场景**比“我想要某个按钮”更有说服力 —— 请说明你现在踩到的是什么问题。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 使用场景
      description: 现在是怎么做的？哪里别扭、慢或容易出错？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 试过哪些折中办法？现有插件 / 设置能不能绕过？
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: 你希望它落在哪里
      options:
        - 编辑器内置功能
        - 导出 / 导入格式（可以用插件实现）
        - 界面 / 交互细节
        - 文档
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 是否愿意自己动手
      options:
        - label: 我可以提 PR
        - label: 我可以写插件（放到官方插件组织）
        - label: 我只能提供反馈和测试
